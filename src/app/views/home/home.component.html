<div class="page">
  <app-next-race></app-next-race>
  <app-standings></app-standings>

  <section class="feed">
    <div class="label section-label">From the Paddock</div>
    <div class="feed-panel cut-card">
      @if(feedState() === 'loading') {
        <mat-spinner diameter="36"></mat-spinner>
      }
      @if(feedState() === 'error') {
        <div class="feed-fallback">
          <p class="label">Couldn&rsquo;t load the X feed.</p>
          <a class="feed-fallback__link" href="https://x.com/F1" target="_blank" rel="noopener">View @&#8203;F1 on X &rarr;</a>
        </div>
      }
      <div #feedContainer [style.display]="feedState() === 'loaded' ? 'block' : 'none'">
        <a class="twitter-timeline" data-theme="dark" data-height="700" href="https://twitter.com/F1?ref_src=twsrc%5Etfw">Tweets by F1</a>
      </div>
    </div>
  </section>
</div>
