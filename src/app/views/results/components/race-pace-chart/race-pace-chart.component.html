<section class="race-pace-chart">
    <div class="section-label-row">
        <div class="label section-label">Race Pace &middot; Lap Times</div>
    </div>

    @if(!loaded()) {
        <div class="loading-panel cut-card">
            <mat-spinner diameter="36"></mat-spinner>
        </div>
    } @else if(series().length) {
        <div class="chart-panel cut-card">
            <app-echart [options]="chartOptions()" height="360px"></app-echart>
        </div>
    } @else {
        <div class="chart-panel cut-card chart-panel--empty label">No lap data available for this race yet.</div>
    }
</section>
