<section class="tire-strategy-chart">
    <div class="section-label-row">
        <div class="label section-label">Tyre Strategy</div>
    </div>

    @if(!loaded()) {
        <div class="loading-panel cut-card">
            <mat-spinner diameter="36"></mat-spinner>
        </div>
    } @else if(drivers().length) {
        <div class="chart-panel cut-card">
            <app-echart [options]="chartOptions()" [height]="chartHeight()"></app-echart>
            <div class="compound-legend">
                @for(compound of usedCompounds(); track compound) {
                    <span class="compound-legend__item">
                        <span class="compound-legend__dot" [style.background-color]="getCompoundColor(compound)"></span>
                        <span class="label">{{ compound }}</span>
                    </span>
                }
            </div>
        </div>
    } @else {
        <div class="chart-panel cut-card chart-panel--empty label">No tyre data available for this race yet.</div>
    }
</section>
