<mat-toolbar class="header">
    <button mat-icon-button class="menu-icon" [matMenuTriggerFor]="menu" aria-label="menu icon">
        <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
        <button mat-menu-item routerLink="home">Home</button>
        <button mat-menu-item routerLink="latest">Latest</button>
        <button mat-menu-item routerLink="schedule">Schedule</button>
        <button mat-menu-item routerLink="results">Results</button>
        <button mat-menu-item routerLink="drivers">Drivers</button>
        <button mat-menu-item routerLink="teams">Teams</button>
    </mat-menu>
    <a routerLink="home" class="brand">
        <span class="brand-mark"></span>
        <span class="disp brand-name">Apex</span>
    </a>
    <ul class="lista-desktop">
        <li><a routerLink="home" routerLinkActive="active" class="label"><span>Home</span></a></li>
        <li><a routerLink="latest" routerLinkActive="active" class="label"><span>Latest</span></a></li>
        <li><a routerLink="schedule" routerLinkActive="active" class="label"><span>Schedule</span></a></li>
        <li><a routerLink="results" routerLinkActive="active" class="label"><span>Results</span></a></li>
        <li><a routerLink="drivers" routerLinkActive="active" class="label"><span>Drivers</span></a></li>
        <li><a routerLink="teams" routerLinkActive="active" class="label"><span>Teams</span></a></li>
    </ul>
    <span class="spacer"></span>
</mat-toolbar>
